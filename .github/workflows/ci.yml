name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - run: node --check src/mc_name_finder/node/bridge.cjs
      - run: node --test tests/node/auth-bridge.test.cjs
      - name: Install authentication helper without signing in
        if: matrix.python == '3.12'
        env:
          MC_NAME_FINDER_HOME: ${{ runner.temp }}/mc-name-finder-auth
        run: mc-name-finder auth-setup
      - run: python -m build
      - run: mc-name-finder --version
